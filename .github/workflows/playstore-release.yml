name: Play Store Release

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check git commit distance for monthly cron
        if: github.event_name == 'schedule'
        id: check_distance
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$TAG" ]; then
            COUNT=$(git rev-list --count HEAD)
          else
            COUNT=$(git rev-list --count ${TAG}..HEAD)
          fi
          echo "commit_count=$COUNT" >> $GITHUB_OUTPUT
          if [ "$COUNT" -eq "0" ]; then
            echo "No new commits since last release. Skipping."
          fi

      - name: Set up Java
        if: github.event_name != 'schedule' || steps.check_distance.outputs.commit_count != '0'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Rust
        if: github.event_name != 'schedule' || steps.check_distance.outputs.commit_count != '0'
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-ndk
        if: github.event_name != 'schedule' || steps.check_distance.outputs.commit_count != '0'
        run: cargo install cargo-ndk

      - name: Build Rust native libs for Android
        if: github.event_name != 'schedule' || steps.check_distance.outputs.commit_count != '0'
        run: |
          cd rust_core
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86 -o ../shared/src/androidMain/jniLibs build --release

      - name: Decode Upload Keystore
        if: github.event_name != 'schedule' || steps.check_distance.outputs.commit_count != '0'
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks
          fi

      - name: Build Signed App Bundle
        if: github.event_name != 'schedule' || steps.check_distance.outputs.commit_count != '0'
        env:
          UPLOAD_KEYSTORE_PATH: ${{ github.workspace }}/upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BLOOM_VERSION_CODE: ${{ github.run_number }}
          BLOOM_VERSION_NAME: "1.0.${{ github.run_number }}"
        run: |
          ./gradlew :androidApp:bundleRelease

      - name: Upload to Google Play
        if: github.event_name != 'schedule' || steps.check_distance.outputs.commit_count != '0'
        uses: r0adkll/upload-google-play@v1
        with:
          service-account-json-PlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: 'com.bloom.android'
          releaseFiles: androidApp/build/outputs/bundle/release/androidApp-release.aab
          track: 'production'
          status: 'inProgress'
          userFraction: 0.1
