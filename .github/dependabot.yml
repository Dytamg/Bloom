version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      patch-and-minor:
        dependency-type: "all"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
  - package-ecosystem: "cargo"
    directory: "/rust_core"
    schedule:
      interval: "weekly"
    groups:
      patch-and-minor:
        dependency-type: "all"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      patch-and-minor:
        dependency-type: "all"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
